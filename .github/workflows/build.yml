name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The base image is ~15 GB compressed; give Docker the large /mnt disk and clear preinstalled SDKs.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          df -h / /mnt

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          IMG=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAG=$(date -u +%Y%m%d)-${GITHUB_SHA::7}
          docker build -t $IMG:$TAG -t $IMG:latest .
          echo "== layer sizes (uncompressed) =="
          docker history $IMG:$TAG --format '{{.Size}}\t{{printf "%.90s" .CreatedBy}}' | head -14
          docker push $IMG:$TAG
          docker push $IMG:latest
          echo "### Pushed \`$IMG:$TAG\`" >> $GITHUB_STEP_SUMMARY
          df -h /mnt
